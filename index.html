<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字怪兽 · Typing Monsters</title>
<style>
  :root{
    --bg:#0b0820; --panel:rgba(20,14,48,.88); --line:#3a2d7a;
    --pink:#ff4fd8; --cyan:#3ff2ff; --yellow:#ffe14d; --green:#5dff9b; --red:#ff4d6a;
    --text:#ecebff; --dim:#8f88c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans JP","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 20px;pointer-events:none;font-weight:700;letter-spacing:.5px}
  .hud .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
  .hud .lbl{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase}
  .hud .val{font-size:22px}
  #score{color:var(--yellow)} #combo{color:var(--pink)} #level{color:var(--cyan)}
  #hearts{font-size:20px;letter-spacing:2px}
  .hud .mid{display:flex;gap:10px}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(40,20,90,.75),rgba(5,3,15,.92));z-index:10}
  .overlay.hidden{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 40px;max-width:760px;width:94%;
    text-align:center;box-shadow:0 0 60px rgba(255,79,216,.18),0 0 120px rgba(63,242,255,.08)}
  h1{margin:0 0 4px;font-size:44px;line-height:1.1;
    background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);margin-bottom:24px}
  .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
  .mode{cursor:pointer;border:2px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);border-radius:14px;
    padding:16px 6px;font-size:15px;font-weight:700;transition:.15s;font-family:inherit}
  .mode .big{display:block;font-size:30px;margin-bottom:6px}
  .mode small{display:block;color:var(--dim);font-weight:500;font-size:11px;margin-top:4px}
  .mode.bleach .big{color:#ff8a3d;text-shadow:0 0 12px #ff8a3d}
  .mode:hover,.mode.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(63,242,255,.35);transform:translateY(-2px)}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:13px 38px;font-size:17px;font-weight:800;font-family:inherit;
    background:linear-gradient(90deg,var(--pink),#9b5cff);color:white;box-shadow:0 0 24px rgba(255,79,216,.45);margin:6px}
  .btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--text)}
  .tips{font-size:13px;color:var(--dim);line-height:1.8;margin-top:18px;text-align:left;
    background:rgba(0,0,0,.25);border-radius:12px;padding:12px 16px}
  .tips b{color:var(--text)}
  kbd{background:#2a2160;border:1px solid #4b3ca0;border-radius:5px;padding:1px 6px;font-size:12px;color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
  .stat{background:rgba(0,0,0,.25);border-radius:12px;padding:10px}
  .stat .v{font-size:24px;font-weight:800;color:var(--yellow)}
  .stat .l{font-size:12px;color:var(--dim)}
  .best{color:var(--dim);font-size:13px;margin-top:6px}
  .newbest{color:var(--green);font-weight:800;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .row{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:13px}
  .row label{cursor:pointer}
  .card{max-height:96vh;overflow:auto;position:relative}
  .langbar{position:absolute;top:14px;right:16px;font-size:13px;color:var(--dim)}
  #imeBox{position:fixed;left:50%;transform:translateX(-50%);width:min(460px,86vw);display:none;z-index:4;
    background:rgba(15,10,40,.9);border:2px solid var(--cyan);border-radius:14px;color:var(--text);
    font:700 26px "PingFang SC","Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif;text-align:center;padding:10px 14px;outline:none;
    box-shadow:0 0 24px rgba(63,242,255,.35)}
  #imeBox::placeholder{color:#5d5694;font-size:16px;font-weight:500}
  #imeBox.bad{border-color:var(--red);box-shadow:0 0 24px rgba(255,77,106,.6);animation:shake .25s}
  @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
  select{background:#1b1450;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:inherit}
  #imeWarn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--red);color:white;padding:8px 16px;
    border-radius:10px;font-weight:700;display:none;z-index:5}
  @media (max-width:700px){.modes{grid-template-columns:repeat(3,1fr)} h1{font-size:32px} .hud .box{min-width:80px;padding:6px 10px}.hud .val{font-size:16px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud" style="display:none">
  <div class="box"><div class="lbl" data-i="hudScore"></div><div class="val" id="score">0</div></div>
  <div class="mid">
    <div class="box"><div class="lbl" data-i="hudLevel"></div><div class="val" id="level">1</div></div>
    <div class="box"><div class="lbl" data-i="hudCombo"></div><div class="val" id="combo">0</div></div>
  </div>
  <div class="box" style="text-align:right"><div class="lbl" data-i="hudHp"></div><div class="val" id="hearts"></div></div>
</div>

<input id="imeBox" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i-ph="imePh">
<div id="imeWarn" data-i="imeWarn"></div>

<!-- 开始界面 -->
<div class="overlay" id="startScr">
  <div class="card">
    <div class="langbar">🌐 <select id="optLang">
      <option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option>
      <option value="ja">日本語</option><option value="en">English</option>
    </select></div>
    <h1 data-i="title"></h1>
    <div class="sub">TYPING MONSTERS · タイピングモンスター</div>
    <div data-i="chooseMode"></div>
    <div class="modes" id="modes">
      <button class="mode sel" data-mode="ja"><span class="big">あ</span><span data-i="m_ja"></span><small data-i="ms_ja"></small></button>
      <button class="mode" data-mode="zh"><span class="big" id="zhIcon">中</span><span data-i="m_zh"></span><small data-i="ms_zh"></small></button>
      <button class="mode" data-mode="en"><span class="big">A</span><span data-i="m_en"></span><small data-i="ms_en"></small></button>
      <button class="mode bleach" data-mode="bleach"><span class="big">卍</span><span data-i="m_bleach"></span><small data-i="ms_bleach"></small></button>
      <button class="mode" data-mode="mix"><span class="big">✦</span><span data-i="m_mix"></span><small data-i="ms_mix"></small></button>
    </div>
    <div class="row">
      <label><span data-i="inputMethod"></span> <select id="optInput">
        <option value="key" data-i="inKey"></option>
        <option value="ime" data-i="inIme"></option>
      </select></label>
      <label id="judgeWrap"><span data-i="judge"></span> <select id="optJudge">
        <option value="loose" data-i="judgeLoose"></option>
        <option value="strict" data-i="judgeStrict"></option>
      </select></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label><input type="checkbox" id="optSound" checked> <span data-i="sound"></span></label>
      <label><input type="checkbox" id="optBgm" checked> BGM</label>
      <label><span data-i="volume"></span> <input type="range" id="optVol" min="0" max="100" value="60" style="width:90px;vertical-align:middle"></label>
      <label><input type="checkbox" id="optGuide" checked> <span data-i="guide"></span></label>
    </div>
    <div class="row" style="margin-top:10px">
      <span id="bgmInfo"></span>
      <button class="btn ghost" id="bgmPick" style="padding:5px 14px;font-size:13px;margin:0" data-i="bgmPick"></button>
      <button class="btn ghost" id="bgmClear" style="padding:5px 12px;font-size:13px;margin:0;display:none" data-i="bgmClear"></button>
      <input type="file" id="bgmFile" accept="audio/*" style="display:none">
    </div>
    <div style="margin-top:18px"><button class="btn" id="startBtn" data-i="start"></button></div>
    <div class="best" id="bestLine"></div>
    <div class="tips" data-i-html="tips"></div>
  </div>
</div>

<!-- 暂停 -->
<div class="overlay hidden" id="pauseScr">
  <div class="card">
    <h1 data-i="paused"></h1>
    <div class="sub">PAUSED</div>
    <button class="btn" id="resumeBtn" data-i="resume"></button>
    <button class="btn ghost" id="quitBtn" data-i="quit"></button>
  </div>
</div>

<!-- 结束 -->
<div class="overlay hidden" id="overScr">
  <div class="card">
    <h1>GAME OVER</h1>
    <div class="sub" id="overMode"></div>
    <div style="font-size:52px;font-weight:900;color:var(--yellow)" id="finalScore">0</div>
    <div id="newBest"></div>
    <div class="stats">
      <div class="stat"><div class="v" id="sLevel">1</div><div class="l" data-i="stLevel"></div></div>
      <div class="stat"><div class="v" id="sKills">0</div><div class="l" data-i="stKills"></div></div>
      <div class="stat"><div class="v" id="sCombo">0</div><div class="l" data-i="stCombo"></div></div>
      <div class="stat"><div class="v" id="sAcc">0%</div><div class="l" data-i="stAcc"></div></div>
      <div class="stat"><div class="v" id="sKpm">0</div><div class="l" data-i="stKpm"></div></div>
      <div class="stat"><div class="v" id="sTime">0s</div><div class="l" data-i="stTime"></div></div>
    </div>
    <button class="btn" id="againBtn" data-i="again"></button>
    <button class="btn ghost" id="menuBtn" data-i="menu"></button>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
/* ===================== 界面语言 i18n ===================== */
const I18N = {

    tips: `<b>玩法：</b>怪兽一只一只出现，在计时条耗尽前打完它的字就能消灭它，下一只马上登场。<br>
      时间到怪兽会攻击你（扣 1 颗心）。打错会断连击，零失误有 PERFECT 加分。每 8 只升一级，每 5 级出现 BOSS。<br>

    modeLbl: "模式", viaIme: "輸入法", viaKey: "鍵盤直打",
    stLevel: "到達等級", stKills: "消滅怪獸", stCombo: "最高連擊", stAcc: "準確率", stKpm: "每分鐘輸入", stTime: "存活時間",
    hudScore: "分數", hudLevel: "等級", hudCombo: "連擊", hudHp: "生命",
    imeWarn: "⚠ 鍵盤直打模式請關閉輸入法（切換為半形英文）", imePh: "用輸入法打字，上屏即判定", needKanji: "要打漢字！",
    tips: `<b>玩法：</b>怪獸一隻一隻出現，在計時條耗盡前打完它的字就能消滅它，下一隻馬上登場。<br>

      時間切れになると攻撃されてHPが1減ります。ミスするとコンボが途切れ、ノーミスならPERFECTボーナス。8体ごとにレベルアップ、5レベルごとにBOSS。<br>

    title: "Typing Monsters", chooseMode: "Choose a mode",
    m_ja: "日本語", ms_ja: "Japanese", m_zh: "中文", ms_zh: "Chinese", m_en: "English", ms_en: "English", m_bleach: "BLEACH", ms_bleach: "Shinigami · JP", m_mix: "Mixed", ms_mix: "All 3 random",

    tips: `<b>How to play:</b> Monsters appear one at a time. Finish typing the word before the timer runs out to defeat it — the next one comes right away.<br>

      <b>Keyboard</b>: Japanese in romaji (shi/si, tsu/tu, ん=nn…), Chinese in pinyin without tones (ü = <kbd>v</kbd>). Turn your IME off.<br>

};
let LANG = "zh-Hans";
const T = k => (I18N[LANG] && I18N[LANG][k]) ?? I18N["zh-Hans"][k] ?? k;
const modeName = m => T("m_" + m);
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T(el.dataset.i); });
  document.querySelectorAll("[data-i-html]").forEach(el => { el.innerHTML = T(el.dataset.iHtml); });
  document.querySelectorAll("[data-i-ph]").forEach(el => { el.placeholder = T(el.dataset.iPh); });
  $("zhIcon").textContent = "中";
  document.title = T("title") + " · Typing Monsters";
  if (typeof showBest === "function") { showBest(); showBgmInfo(); }
}
(function initLang() {
  let l = null;
  try { l = localStorage.getItem("typingMonstersLang"); } catch (e) {}
  if (!l) { const n = (navigator.language || "").toLowerCase();
    l = /^zh-(tw|hk|mo)|hant/.test(n) ? "zh-Hant" : n.startsWith("zh") ? "zh-Hans" : n.startsWith("ja") ? "ja" : n.startsWith("en") ? "en" : "zh-Hans"; }
  LANG = I18N[l] ? l : "zh-Hans";

function kanaUnits(reading) {
  const s = toHira(reading); const raw = [];
  for (let i = 0; i < s.length;) {

    if (COMBO[two]) { raw.push(uniq([...COMBO[two], ...cross(KANA[two[0]], KANA[two[1]])])); i += 2; }
    else { raw.push(KANA[s[i]] ? [...KANA[s[i]]] : [s[i]]); i++; }
  }

  const out = [];
  for (let i = 0; i < raw.length; i++) {
    const cur = raw[i], ch = toHira(reading)[0];
    if (cur.includes("xtu") && i + 1 < raw.length) {           // っ + 下一个
      const nx = raw[i + 1];
      const dbl = nx.filter(o => /^[bcdfghjklmpqrstvwxyz]/.test(o) && !o.startsWith("n")).map(o => o[0] + o);
      nx.filter(o => o.startsWith("ch")).forEach(o => dbl.push("t" + o));   // っちゃ = tcha
      out.push(uniq([...dbl, ...cross(cur, nx)])); i++; continue;
    }
    if (cur.includes("nn") && cur.includes("xn")) {             // ん

function step(units, st, ch) {
  if (st.ui >= units.length) return null;
  const u = units[st.ui], nb = st.buf + ch;
  if (u.opts.some(o => o.startsWith(nb))) {
    const exact = u.opts.includes(nb);
    const longer = u.opts.some(o => o.length > nb.length && o.startsWith(nb));
    if (exact && (!longer || st.ui === units.length - 1)) return { ui: st.ui + 1, buf: "", typed: st.typed + ch };
    return { ui: st.ui, buf: nb, typed: st.typed + ch };
  }
  if (st.buf && u.opts.includes(st.buf)) {   // 当前音节已可完成（如 n），转入下一音节
    return step(units, { ui: st.ui + 1, buf: "", typed: st.typed }, ch);
  }
  return null;
}

  let r = "";

    const u = units[st.ui];
    const o = u.opts.find(o => o.startsWith(st.buf) && o.length > st.buf.length) || u.opts[0];
    r += o.slice(st.buf.length);
    for (let i = st.ui + 1; i < units.length; i++) r += units[i].opts[0];
  }

}

    // BLEACH篇：原创暗黑 J-Rock（失真吉他强力和弦 + 三味线 + 鼓）
    bleach: { bpm: 140, root: 52, scale: [0, 1, 5, 7, 8], bars: [0, 3, 5, -2], density: .5, span: 9,
      play(i, t, spb, lv, bs) {

        if (s % 2 === 0) subBass(r - 24, t, spb * .9, .3);

        if (s === 4 || s === 12) snare(t);
        hat(t, false);
        if (s === 0 && b === 0) crash(t);

      master.gain.exponentialRampToValueAtTime(Math.max(.0001, vol()), ac.currentTime + .8);

    stop() {

    },
    pause() { if (timer) clearInterval(timer); timer = null; if (master) master.gain.setTargetAtTime(0.0001, ac.currentTime, .05); },
    resume() { if (!S || timer) return; nextTime = ac.currentTime + .08; master.gain.setTargetAtTime(Math.max(.0001, vol()), ac.currentTime, .1); timer = setInterval(tick, 25); },
    setVolume() { if (master && S && timer) master.gain.setTargetAtTime(Math.max(.0001, vol()), ac.currentTime, .05); },

})();

/* ---------- 自定义 BGM（玩家自己的音乐文件，保存在本机浏览器） ---------- */
const Custom = (() => {
  const audio = new Audio(); audio.loop = true;
  let url = null; const cache = {};
  function db() { return new Promise((res, rej) => { try { const r = indexedDB.open("typingMonstersBgm", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("bgm"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
  async function op(fn) { try { const d = await db(); return await new Promise((res, rej) => { const tx = d.transaction("bgm", "readwrite"); const q = fn(tx.objectStore("bgm")); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } }
  return {
    async get(m) { if (m in cache) return cache[m]; const v = await op(s => s.get(m)); cache[m] = v || null; return cache[m]; },
    async set(m, file) { cache[m] = { name: file.name, blob: file }; await op(s => s.put({ name: file.name, blob: file }, m)); },
    async clear(m) { cache[m] = null; await op(s => s.delete(m)); },
    play(rec) { this.stop(); url = URL.createObjectURL(rec.blob); audio.src = url; audio.volume = +$("optVol").value / 100; audio.currentTime = 0; audio.play().catch(() => {}); },
    stop() { audio.pause(); if (url) { URL.revokeObjectURL(url); url = null; } },
    pause() { audio.pause(); }, resume() { if (url) audio.play().catch(() => {}); },
    setVolume() { audio.volume = +$("optVol").value / 100; }, get active() { return !!url; }
  };
})();
const BGM = {
  cur: null,
  async start(m) {
    this.stop(); if (!$("optBgm").checked) return;
    getAC(); try { actx.resume(); } catch (e) {}
    const rec = await Custom.get(m);
    if (!running) return;
    if (rec) { this.cur = "custom"; Custom.play(rec); } else { this.cur = "synth"; Music.start(m); }
  },
  stop() { Music.stop(); Custom.stop(); this.cur = null; },
  pause() { Music.pause(); Custom.pause(); },
  resume() { if (this.cur === "synth") Music.resume(); else if (this.cur === "custom") Custom.resume(); },
  setVolume() { Music.setVolume(); Custom.setVolume(); }
};

/* ===================== 怪兽绘制（程序化生成） ===================== */
const SHAPES = ["blob", "ghost", "eye", "bat", "robot", "spiky", "squid", "slime"];
function makeLook(boss) {
  return {
    shape: boss ? pick(["spiky", "robot", "squid", "eye"]) : pick(SHAPES),
    hue: rand(0, 360) | 0, eyes: boss ? 3 : pick([1, 2, 2, 2, 3]),
    horns: Math.random() < (boss ? 1 : .35), teeth: Math.random() < .5, phase: rand(0, 6.28)
  };
}
function drawMonster(m, t) {
  const L = m.look, r = m.r, x = m.x, y = m.y + Math.sin(t * 3 + L.phase) * 4;
  const c1 = `hsl(${L.hue},90%,62%)`, c2 = `hsl(${(L.hue + 40) % 360},85%,40%)`;
  ctx.save(); ctx.translate(x, y);
  if (m.hitFlash > 0) ctx.translate(rand(-3, 3), rand(-3, 3));
  ctx.shadowColor = c1; ctx.shadowBlur = m.locked ? 30 : 14;
  const g = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r * 1.1);
  g.addColorStop(0, `hsl(${L.hue},100%,80%)`); g.addColorStop(.6, c1); g.addColorStop(1, c2);
  ctx.fillStyle = m.hitFlash > 0 ? "#fff" : g;
  ctx.beginPath();
  switch (L.shape) {
    case "blob": for (let i = 0; i <= 24; i++) { const a = i / 24 * 6.283, rr = r * (1 + .08 * Math.sin(a * 5 + t * 4)); i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0); } break;
    case "ghost": ctx.arc(0, -r * .1, r * .9, Math.PI, 0); for (let i = 0; i <= 6; i++) ctx.lineTo(r * .9 - i * r * .3, r * .8 + (i % 2 ? -r * .2 : 0) + Math.sin(t * 6 + i) * 3); break;
    case "eye": ctx.arc(0, 0, r, 0, 6.283); break;
    case "bat": ctx.ellipse(0, 0, r * .7, r * .75, 0, 0, 6.283);
      for (const s of [-1, 1]) { const f = Math.sin(t * 10 + L.phase) * .25; ctx.moveTo(s * r * .5, -r * .2); ctx.quadraticCurveTo(s * r * 1.6, -r * (1 + f), s * r * 1.7, r * .2); ctx.quadraticCurveTo(s * r * 1.2, 0, s * r * .5, r * .3); } break;
    case "robot": ctx.roundRect ? ctx.roundRect(-r * .85, -r * .8, r * 1.7, r * 1.6, r * .25) : ctx.rect(-r * .85, -r * .8, r * 1.7, r * 1.6); break;
    case "spiky": for (let i = 0; i <= 28; i++) { const a = i / 28 * 6.283 + t * .5, rr = i % 2 ? r * .78 : r * 1.12; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0); } break;
    case "squid": ctx.ellipse(0, -r * .2, r * .8, r * .7, 0, 0, 6.283);
      for (let i = 0; i < 5; i++) { const bx = -r * .6 + i * r * .3; ctx.moveTo(bx - 5, r * .3); ctx.quadraticCurveTo(bx + Math.sin(t * 5 + i) * 10, r * .9, bx, r * 1.2); ctx.lineTo(bx + 6, r * .3); } break;
    case "slime": ctx.moveTo(-r, r * .7); ctx.quadraticCurveTo(-r, -r * 1.1, 0, -r * (1 + .1 * Math.sin(t * 4))); ctx.quadraticCurveTo(r, -r * 1.1, r, r * .7); ctx.closePath(); break;
  }
  ctx.fill(); ctx.shadowBlur = 0;
  // 角
  if (L.horns) { ctx.fillStyle = `hsl(${(L.hue + 180) % 360},80%,70%)`;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * .3, -r * .65); ctx.lineTo(s * r * .65, -r * 1.35); ctx.lineTo(s * r * .6, -r * .55); ctx.fill(); } }
  if (m.boss) { ctx.fillStyle = "#ffe14d"; ctx.beginPath(); const cy = -r * 1.15;
    ctx.moveTo(-r * .45, cy); ctx.lineTo(-r * .45, cy - r * .35); ctx.lineTo(-r * .22, cy - r * .15); ctx.lineTo(0, cy - r * .45); ctx.lineTo(r * .22, cy - r * .15); ctx.lineTo(r * .45, cy - r * .35); ctx.lineTo(r * .45, cy); ctx.fill(); }
  // 眼睛（看向玩家）
  const look = Math.atan2(H - 60 - y, W / 2 - x), er = L.shape === "eye" ? r * .55 : r * (L.eyes === 1 ? .36 : .24);
  const pos = L.eyes === 1 ? [[0, -r * .15]] : L.eyes === 2 ? [[-r * .32, -r * .2], [r * .32, -r * .2]] : [[-r * .4, -r * .1], [r * .4, -r * .1], [0, -r * .45]];
  const blink = (Math.sin(t * 1.3 + L.phase * 3) > .97);
  for (const [ex, ey] of (L.shape === "eye" ? [[0, 0]] : pos)) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(ex, ey, er, blink ? er * .1 : er, 0, 0, 6.283); ctx.fill();
    if (!blink) { ctx.fillStyle = L.shape === "eye" ? `hsl(${L.hue},90%,35%)` : "#140a2a"; ctx.beginPath();
      ctx.arc(ex + Math.cos(look) * er * .4, ey + Math.sin(look) * er * .4, er * .5, 0, 6.283); ctx.fill();
      if (L.shape === "eye") { ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(ex + Math.cos(look) * er * .4, ey + Math.sin(look) * er * .4, er * .22, 0, 6.283); ctx.fill(); } }
  }
  // 嘴
  if (L.shape !== "eye") {
    ctx.fillStyle = "#140a2a"; ctx.beginPath(); const mw = r * .45, my = r * .3;
    ctx.ellipse(0, my, mw, r * .14 + Math.max(0, Math.sin(t * 5 + L.phase)) * r * .06, 0, 0, Math.PI); ctx.fill();
    if (L.teeth) { ctx.fillStyle = "#fff"; for (let i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.moveTo(i * mw * .5 - 4, my); ctx.lineTo(i * mw * .5 + 4, my); ctx.lineTo(i * mw * .5, my + 8); ctx.fill(); } }
  }
  ctx.restore();
}

/* ===================== 游戏状态 ===================== */
let G = null, mode = "ja", running = false, paused = false, last = 0;
const BEST_KEY = "typingMonstersBest";
function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; } }
function saveBest(b) { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) {} }

function newGame() {
  G = { enemies: [], parts: [], pops: [], beams: [], score: 0, combo: 0, maxCombo: 0, hp: 5, maxHp: 5,
    kills: 0, level: 1, keys: 0, misses: 0, time: 0, gap: 0.8, next: null, lock: null, shake: 0, bossAlive: false,
    bossDoneFor: 0, flash: 0, banner: { text: "LEVEL 1", t: 2 }, recent: [] };
}

function makeWord(tier, lang) {
  const L = lang === "mix" ? pick(["ja", "zh", "en"]) : lang;
  const JD = L === "bleach" ? BL : JA;
  let item, tries = 0;
  do {
    if (L === "ja" || L === "bleach") { const [d, r] = pick(JD[tier]); item = { lang: "ja", display: d, sub: toHira(d) === r ? "" : r, units: kanaUnits(r), key: d }; }
    else if (L === "zh") { const [d, p] = pick(ZH[tier]); item = { lang: L, display: LANG === "zh-Hant" ? toTrad(d) : d, alt: [d, toTrad(d)], sub: "", units: letterUnits(p), key: d }; }
    else { const w = pick(EN[tier]); item = { lang: L, display: w, sub: "", units: letterUnits(w), key: w }; }
  } while ((G.recent.includes(item.key) || G.enemies.some(e => e.word.key === item.key)) && ++tries < 20);
  G.recent.push(item.key); if (G.recent.length > 8) G.recent.shift();
  item.len = item.units.reduce((s, u) => s + u.opts[0].length, 0);
  return item;
}

function tierFor(lv) {
  const r = Math.random();
  if (lv <= 2) return "t1";
  if (lv <= 4) return r < .5 ? "t1" : "t2";
  if (lv <= 7) return r < .2 ? "t1" : r < .7 ? "t2" : "t3";
  return r < .4 ? "t2" : "t3";
}
const diff = lv => ({
  perChar: Math.max(0.18, 0.78 - lv * 0.045)
});

function spawn(boss = false) {
  let word;
  if (boss) word = makeWord("boss", mode);
  else { word = G.next || makeWord(tierFor(G.level), mode); G.next = null; }
  const d = diff(G.level);
  let life = boss ? 5 + word.len * Math.max(0.3, d.perChar * 1.2) : Math.max(2.5, 4 - G.level * 0.12) + word.len * d.perChar;
  if (imeMode() && word.lang !== "en") life *= 1.3;
  const r0 = (boss ? 80 : rand(56, 66)) * (imeMode() ? .7 : 1);
  const e = { x: W / 2, y: monY(), r: r0 * .2, r0, word, st: { ui: 0, buf: "", typed: "" }, life, t: 0, boss,
    look: makeLook(boss), locked: true, hitFlash: 0, dead: false, miss: 0 };
  G.enemies = [e]; G.lock = e; if (imeMode()) imeReset();
  G.next = makeWord(tierFor(G.level), mode);           // 预告下一只
  if (boss) { G.bossAlive = true; Music.setBoss(true); G.banner = { text: mode === "bleach" ? "卍解 BANKAI!" : "⚠ BOSS ⚠", t: 1.6, color: "#ff4d6a" }; beep(110, .5, "sawtooth", .08, -60); }
  else beep(300, .06, "triangle", .04, 200);
}

const playerY = () => H - 70;
const monY = () => imeMode() ? Math.max(130, H * .2) : Math.max(170, H * .33);

function update(dt) {
  G.time += dt;
  // 一次只出一只：当前怪兽消失后，短暂间隔再出下一只
  if (!G.enemies.length) {
    G.gap -= dt;
    if (G.gap <= 0) {
      const bossDue = G.level % 5 === 0 && G.bossDoneFor !== G.level;
      if (bossDue) { G.bossDoneFor = G.level; spawn(true); } else spawn();
    }
  }
  for (const e of G.enemies) {
    e.t += dt; e.hitFlash = Math.max(0, e.hitFlash - dt);
    const p = Math.min(1, e.t / e.life);
    e.x = W / 2; e.y = monY();
    e.r = e.r0 * (.2 + .8 * Math.min(1, e.t * 5)) * (1 + .4 * p);   // 登场放大 + 随时间逼近变大
    if (e.t >= e.life && !e.dead) {     // 时间到：怪兽攻击
      e.dead = true; G.hp--; G.combo = 0; G.shake = .45; G.flash = .4; G.lock = null; G.gap = .7;
      if (e.boss) { G.bossAlive = false; Music.setBoss(false); }
      burst(e.x, e.y, "#ff4d6a", 40); beep(80, .3, "sawtooth", .1, -40);
      G.pops.push({ x: e.x, y: e.y - e.r - 20, text: "-1 ♥  TIME UP", color: "#ff4d6a", t: 1.2 });
      if (imeMode()) imeReset();
      if (G.hp <= 0) return gameOver();
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; }
  G.parts = G.parts.filter(p => p.t > 0);
  for (const p of G.pops) { p.y -= 40 * dt; p.t -= dt; }
  G.pops = G.pops.filter(p => p.t > 0);
  for (const b of G.beams) b.t -= dt;
  G.beams = G.beams.filter(b => b.t > 0);
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) { const a = rand(0, 6.283), s = rand(80, 360);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, t: rand(.4, .9), color, size: rand(2, 5) }); }
}

function kill(e) {
  e.dead = true; G.kills++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  const mult = Math.min(4, 1 + Math.floor(G.combo / 10) * 0.5);
  const timeBonus = Math.round((1 - e.t / e.life) * 50);
  const perfect = e.miss === 0 ? Math.round(e.word.len * 5 * (1 + G.level * 0.2)) : 0;
  const pts = Math.round((e.word.len * 10 * (1 + G.level * 0.2) + timeBonus + perfect) * mult * (e.boss ? 3 : 1));
  G.score += pts; G.gap = e.boss ? .9 : .3;
  if (perfect) G.pops.push({ x: e.x, y: e.y - e.r - 50, text: "PERFECT!", color: "#5dff9b", t: 1 });
  burst(e.x, e.y, `hsl(${e.look.hue},90%,65%)`, e.boss ? 80 : 32);
  G.pops.push({ x: e.x, y: e.y - 20, text: `+${pts}` + (mult > 1 ? ` ×${mult}` : ""), color: "#ffe14d", t: 1.1 });
  beep(e.boss ? 330 : 660, e.boss ? .4 : .15, "triangle", .08, e.boss ? 600 : 400);
  if (e.boss) { G.bossAlive = false; Music.setBoss(false); G.shake = .5; G.hp = Math.min(G.maxHp, G.hp + 1);
    G.pops.push({ x: e.x, y: e.y + 20, text: "+1 ♥", color: "#5dff9b", t: 1.5 }); }
  G.lock = null;
  const newLv = 1 + Math.floor(G.kills / 8);
  if (newLv > G.level) { G.level = newLv; Music.setLevel(newLv); G.banner = { text: `LEVEL ${newLv}`, t: 1.8, color: "#3ff2ff" }; beep(523, .12, "square", .06); setTimeout(() => beep(784, .2, "square", .06), 110); }
}

function onKey(ch) {
  if (!G || !running || paused) return;
  G.keys++;
  const target = G.enemies[0];
  if (!target) { G.keys--; return; }
  const ns = target && step(target.word.units, target.st, ch);
  if (!ns) {
    G.misses++; G.combo = 0; G.flash = Math.max(G.flash, .12); beep(140, .08, "square", .05);
    target.hitFlash = .1; target.miss++;
    return;
  }
  target.st = ns; target.hitFlash = .06;
  G.beams.push({ x: target.x, y: target.y, t: .12 });
  beep(880 + ns.typed.length * 15, .03, "square", .025);
  if (ns.ui >= target.word.units.length) kill(target);
}

/* ===================== 渲染 ===================== */
let stars = [];
function initStars() { stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), s: rand(.5, 2), v: rand(.005, .03) })); }
initStars();

function render(t) {
  ctx.save();
  ctx.fillStyle = "#0b0820"; ctx.fillRect(0, 0, W, H);
  if (G && G.shake > 0) ctx.translate(rand(-8, 8) * G.shake, rand(-8, 8) * G.shake);
  // 星空
  for (const s of stars) { s.y = (s.y + s.v * (1 / 60)) % 1; ctx.fillStyle = `rgba(200,190,255,${.3 + s.s / 3})`; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  // 网格地平线
  ctx.strokeStyle = "rgba(255,79,216,.18)"; ctx.lineWidth = 1;
  const hy = H * .62;
  for (let i = 0; i < 14; i++) { const yy = hy + Math.pow(i / 14, 2) * (H - hy) + ((t * 30) % 20) * (i / 14); ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, hy); ctx.lineTo(W / 2 + i * 160, H); ctx.stroke(); }

  if (G && running) {
    // 危险线
    // 玩家炮台
    const px = W / 2, py = playerY();
    const aim = G.lock ? Math.atan2(G.lock.y - py, G.lock.x - px) : -Math.PI / 2;
    ctx.save(); ctx.translate(px, py);
    ctx.shadowColor = "#3ff2ff"; ctx.shadowBlur = 20;
    ctx.fillStyle = "#1b1450"; ctx.strokeStyle = "#3ff2ff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 10, 34, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.rotate(aim + Math.PI / 2); ctx.fillStyle = "#3ff2ff"; ctx.fillRect(-6, -46, 12, 40);
    ctx.restore();
    // 光束
    for (const b of G.beams) { ctx.strokeStyle = `rgba(63,242,255,${b.t / .12})`; ctx.lineWidth = 3; ctx.shadowColor = "#3ff2ff"; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.moveTo(px, py - 10); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.shadowBlur = 0; }
    // 怪兽
    const sorted = [...G.enemies].sort((a, b) => (a === G.lock) - (b === G.lock));
    for (const e of sorted) { e.locked = e === G.lock; drawMonster(e, t); }
    for (const e of sorted) drawLabel(e);
    drawNext();
    // 粒子
    for (const p of G.parts) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
    ctx.globalAlpha = 1;
    for (const p of G.pops) { ctx.globalAlpha = Math.min(1, p.t * 1.5); ctx.fillStyle = p.color; ctx.font = `800 20px ${FONT}`; ctx.textAlign = "center"; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;
    // 横幅
    if (G.banner) { const b = G.banner; ctx.globalAlpha = Math.min(1, b.t * 2); ctx.font = `900 ${Math.min(48, W / 12)}px ${FONT}`; ctx.textAlign = "center";
      ctx.fillStyle = b.color || "#3ff2ff"; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 30; ctx.fillText(b.text, W / 2, Math.max(monY() + 300, H - 150)); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,40,80,${G.flash * .5})`; ctx.fillRect(0, 0, W, H); }
  }
  ctx.restore();
}

// 按宽度自动缩小字号
function fitFont(text, weight, size, family, maxW) {
  ctx.font = `${weight} ${size}px ${family}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) { size = Math.max(12, Math.floor(size * maxW / w)); ctx.font = `${weight} ${size}px ${family}`; }
  return size;
}
function drawColored(typed, rest, cx, y, typedColor, restColor) {
  const fw = ctx.measureText(typed + rest).width; let x0 = cx - fw / 2;
  ctx.textAlign = "left";
  ctx.fillStyle = typedColor; ctx.fillText(typed, x0, y); x0 += ctx.measureText(typed).width;
  ctx.fillStyle = restColor; ctx.fillText(rest, x0, y);
  ctx.textAlign = "center";
}
function drawLabel(e) {
  const w = e.word, guide = $("optGuide").checked, maxW = W * .9;
  const ime = imeMode(), ip = e.ime || { which: "", n: 0 };
  let typed = e.st.typed, rest = remaining(w.units, e.st);
  if (ime) { typed = ""; rest = ""; }
  let y = monY() + e.r0 * 1.45 + 40;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 8;
  if (ime) {
    const D = w.display; let dn = 0;
    if (ip.which === "display") { let c = 0; while (dn < D.length && c < ip.n) { if (normIme(D[dn])) c++; dn++; } }
    fitFont(D, 800, e.boss ? 50 : 56, w.lang === "en" ? MONO : FONT, maxW);
    drawColored(D.slice(0, dn), D.slice(dn), W / 2, y, "#3ff2ff", "#fff");
    if (w.sub && guide) { y += 32; const sn = ip.which === "sub" ? ip.n : 0; fitFont(w.sub, 600, 22, FONT, maxW); drawColored(w.sub.slice(0, sn), w.sub.slice(sn), W / 2, y, "#3ff2ff", "#c7c1f5"); }
    if (w.lang === "zh" && guide) { y += 30; const p = w.units.map(u => u.opts[0]).join(""), pn = ip.which === "pinyin" ? ip.n : 0; fitFont(p, 600, 18, MONO, maxW); drawColored(p.slice(0, pn), p.slice(pn), W / 2, y, "#3ff2ff", "#8f88c9"); }
    y += 8;
  } else if (w.lang === "en") {
    const s = fitFont(typed + rest, 800, e.boss ? 46 : 52, MONO, maxW);
    drawColored(typed, rest, W / 2, y, "#3ff2ff", "#fff"); y += s * .4;
  } else {
    const s = fitFont(w.display, 800, e.boss ? 50 : 56, FONT, maxW);
    ctx.fillStyle = typed.length ? "#e6fdff" : "#fff"; ctx.fillText(w.display, W / 2, y);
    if (w.sub) { y += 30; fitFont(w.sub, 500, 20, FONT, maxW); ctx.fillStyle = "#c7c1f5"; ctx.fillText(w.sub, W / 2, y); }
    y += 36; fitFont(typed + rest, 700, 26, MONO, maxW);
    if (guide) drawColored(typed, rest, W / 2, y, "#3ff2ff", "#8f88c9");
    else { ctx.fillStyle = "#3ff2ff"; ctx.fillText(typed || " ", W / 2, y); }
  }
  ctx.shadowBlur = 0;
  // 计时条
  const p = Math.max(0, 1 - e.t / e.life), bw = Math.min(520, W * .7), by = y + 24;
  ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(W / 2 - bw / 2, by, bw, 10);
  ctx.fillStyle = p > .5 ? "#5dff9b" : p > .25 ? "#ffe14d" : "#ff4d6a";
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
  ctx.fillRect(W / 2 - bw / 2, by, bw * p, 10); ctx.shadowBlur = 0;
  ctx.font = `700 13px ${MONO}`; ctx.fillStyle = "#8f88c9";
  ctx.fillText((e.life - e.t).toFixed(1) + "s", W / 2, by + 30);
  if (ime) imeBox.style.top = Math.min(H - 150, by + 44) + "px";
}
function drawNext() {
  if (!G.next) return;
  const x = W - 24, y = H - 40;
  ctx.textAlign = "right";
  ctx.font = `700 12px ${FONT}`; ctx.fillStyle = "#8f88c9"; ctx.fillText("NEXT ▸", x, y - 26);
  ctx.font = `800 20px ${G.next.lang === "en" ? MONO : FONT}`; ctx.fillStyle = "rgba(236,235,255,.75)";
  ctx.fillText(G.next.display, x, y);
  ctx.textAlign = "center";
}

function hud() {
  $("score").textContent = G.score.toLocaleString();
  $("level").textContent = G.level;
  const mult = Math.min(4, 1 + Math.floor(G.combo / 10) * 0.5);
  $("combo").textContent = G.combo + (mult > 1 ? ` ×${mult}` : "");
  $("hearts").innerHTML = "<span style='color:#ff4d6a'>" + "♥".repeat(Math.max(0, G.hp)) + "</span><span style='color:#3a2d7a'>" + "♥".repeat(Math.max(0, G.maxHp - G.hp)) + "</span>";
}

function loop(ts) {
  const t = ts / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
  if (running && !paused) { update(dt); if (running) hud(); }
  render(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===================== 输入法模式（IME） ===================== */
const imeMode = () => $("optInput").value === "ime";
const imeBox = $("imeBox");
let composing = false, imePrev = 0;
const normIme = s => toHira(s).toLowerCase().replace(/[\s・·　]/g, "");
const strict = () => $("optJudge").value === "strict";
function imeCands(w, all) {
  const c = [{ s: normIme(w.display), which: "display" }];
  if (w.alt) w.alt.forEach(a => { if (normIme(a) !== c[0].s) c.push({ s: normIme(a), which: "display" }); });   // 简繁都算
  if (strict() && !all) return c;
  if (w.lang === "ja" && w.sub) c.push({ s: normIme(w.sub), which: "sub" });
  if (w.lang === "zh") c.push({ s: w.units.map(u => u.opts[0]).join(""), which: "pinyin" });
  return c;
}
function imeReset() { imeBox.value = ""; imePrev = 0; imeBox.classList.remove("bad"); }
function imeCheck() {
  if (!G || !running || paused || composing) return;
  const e = G.enemies[0]; if (!e) { imeReset(); return; }
  const v = normIme(imeBox.value);
  if (!v) { imePrev = 0; e.ime = null; imeBox.classList.remove("bad"); return; }
  const cands = imeCands(e.word), hit = cands.find(c => c.s.startsWith(v));
  if (hit) {
    imeBox.classList.remove("bad");
    if (v.length > imePrev) { G.keys += v.length - imePrev; G.beams.push({ x: e.x, y: e.y, t: .12 }); e.hitFlash = .06; beep(880 + v.length * 30, .03, "square", .025); }
    imePrev = v.length; e.ime = { which: hit.which, n: v.length };
    if (v === hit.s) { kill(e); imeReset(); }
  } else {
    G.keys++; G.misses++; G.combo = 0; G.flash = Math.max(G.flash, .12); e.miss++; e.hitFlash = .1;
    beep(140, .08, "square", .05);
    if (strict() && imeCands(e.word, true).some(c => c.s.startsWith(v))) G.pops.push({ x: e.x, y: e.y - e.r - 30, text: T("needKanji"), color: "#ffe14d", t: 1 });
    let k = v.length; while (k > 0 && !cands.some(c => c.s.startsWith(v.slice(0, k)))) k--;
    imeBox.value = v.slice(0, k); imePrev = k; e.ime = k ? e.ime : null;
    imeBox.classList.add("bad"); setTimeout(() => imeBox.classList.remove("bad"), 300);
  }
}
imeBox.addEventListener("compositionstart", () => { composing = true; });
imeBox.addEventListener("compositionend", () => { composing = false; setTimeout(imeCheck, 0); });
imeBox.addEventListener("input", e => { if (!e.isComposing) imeCheck(); });
function showImeBox() {
  const on = running && imeMode();
  imeBox.style.display = on ? "block" : "none";
  if (on && !paused) imeBox.focus();
}
document.addEventListener("mousedown", e => { if (running && imeMode() && e.target !== imeBox && !e.target.closest(".overlay")) { e.preventDefault(); imeBox.focus(); } });

/* ===================== 流程控制 ===================== */
function start() {
  newGame(); running = true; paused = false; BGM.start(mode); imeReset(); showImeBox();
  ["startScr", "overScr", "pauseScr"].forEach(id => $(id).classList.add("hidden"));
  $("hud").style.display = "flex"; hud(); beep(440, .1); setTimeout(() => beep(660, .15), 100);
}
function gameOver() {
  running = false; BGM.stop(); showImeBox(); imeBox.blur(); $("hud").style.display = "none";
  const acc = G.keys ? Math.round((G.keys - G.misses) / G.keys * 100) : 0;
  $("finalScore").textContent = G.score.toLocaleString();
  $("overMode").textContent = T("modeLbl") + "：" + modeName(mode) + " · " + (imeMode() ? T("viaIme") + (strict() ? " · " + T("judgeStrict").split(/[:：]/)[0] : "") : T("viaKey"));
  $("sLevel").textContent = G.level; $("sKills").textContent = G.kills; $("sCombo").textContent = G.maxCombo;
  $("sAcc").textContent = acc + "%"; $("sKpm").textContent = Math.round((G.keys - G.misses) / Math.max(1, G.time) * 60);
  $("sTime").textContent = Math.round(G.time) + "s";
  const best = loadBest(), bk = mode + bestSfx();
  if (G.score > (best[bk] || 0)) { best[bk] = G.score; saveBest(best); $("newBest").innerHTML = `<div class='newbest'>${T("newBest")}</div>`; }
  else $("newBest").innerHTML = `<div class="best">${T("best")}: ${(best[bk] || 0).toLocaleString()}</div>`;
  $("overScr").classList.remove("hidden"); beep(220, .6, "sawtooth", .08, -150);
}
function showBest() {
  const b = loadBest(), sfx = bestSfx();
  $("bestLine").textContent = (sfx ? T("bestIme") : T("best")) + " · " + ["ja", "zh", "en", "bleach", "mix"].map(m => `${modeName(m)} ${(b[m + sfx] || 0).toLocaleString()}`).join("  |  ");
  $("judgeWrap").style.display = imeMode() ? "" : "none";
}
function bestSfx() { return imeMode() ? (strict() ? "_ime_s" : "_ime") : "";
}
function toMenu() { running = false; paused = false; G = null; BGM.stop(); showImeBox(); $("hud").style.display = "none";
  ["overScr", "pauseScr"].forEach(id => $(id).classList.add("hidden")); $("startScr").classList.remove("hidden"); showBest(); }

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".mode").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); mode = b.dataset.mode; showBgmInfo();
}));
$("startBtn").onclick = start; $("againBtn").onclick = start; $("menuBtn").onclick = toMenu; $("quitBtn").onclick = toMenu;
function setPaused(v) { paused = v; $("pauseScr").classList.toggle("hidden", !v); v ? BGM.pause() : BGM.resume(); if (v) imeBox.blur(); showImeBox(); }
$("optJudge").onchange = () => { showBest(); try { localStorage.setItem("typingMonstersJudge", $("optJudge").value); } catch (e) {} };
$("optLang").onchange = () => { LANG = $("optLang").value; try { localStorage.setItem("typingMonstersLang", LANG); } catch (e) {} applyLang(); };
try { const jv = localStorage.getItem("typingMonstersJudge"); if (jv) $("optJudge").value = jv; } catch (e) {}
$("optInput").onchange = () => { showBest(); try { localStorage.setItem("typingMonstersInput", $("optInput").value); } catch (e) {} };
try { const iv = localStorage.getItem("typingMonstersInput"); if (iv) $("optInput").value = iv; } catch (e) {}
$("resumeBtn").onclick = () => setPaused(false);
async function showBgmInfo() {
  const rec = await Custom.get(mode);
  $("bgmInfo").textContent = `${modeName(mode)} BGM: ` + (rec ? `🎵 ${rec.name}` : T("bgmOrig"));
  $("bgmClear").style.display = rec ? "" : "none";
}
$("bgmPick").onclick = () => $("bgmFile").click();
$("bgmFile").onchange = async e => { const f = e.target.files[0]; if (f) { await Custom.set(mode, f); showBgmInfo(); } e.target.value = ""; };
$("bgmClear").onclick = async () => { await Custom.clear(mode); showBgmInfo(); };
$("optVol").oninput = () => BGM.setVolume();
$("optBgm").onchange = () => { if (running && !$("optBgm").checked) BGM.stop(); };
$("optLang").value = LANG; applyLang();

let imeTimer = 0;
addEventListener("keydown", e => {
  if (running && imeMode()) {
    if (e.key === "Escape" && !e.isComposing) { setPaused(!paused); e.preventDefault(); }
    return;
  }
  if (e.isComposing || e.key === "Process" || e.keyCode === 229) {
    $("imeWarn").style.display = "block"; clearTimeout(imeTimer); imeTimer = setTimeout(() => $("imeWarn").style.display = "none", 2500); return;
  }
  if (!running) { if (e.key === "Enter" && !$("startScr").classList.contains("hidden")) start();
    else if (e.key === "Enter" && !$("overScr").classList.contains("hidden")) start(); return; }
  if (e.key === "Escape") { setPaused(!paused); e.preventDefault(); return; }
  if (paused) return;
  if (e.key === "Backspace") { e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1) {
    const ch = e.key.toLowerCase();
    if (/[a-z0-9 '\-,.!?]/.test(ch)) { e.preventDefault(); onKey(ch); }
  }
});
addEventListener("blur", () => { if (running && !paused) setPaused(true); });

// 供测试
window.__TM = { kanaUnits, step, remaining, get G() { return G; } };
})();
</script>
